<!DOCTYPE html>

        <title>Tabla prueba 1</title>
        <link rel="stylesheet" href="stilosss.css">
    </head>
    <body>
        <main>

                <legend>Tabla prueba 1</legend>
                <table>

                            <th>columna 1</th>

                    <tbody>
                        <tr>
                            <td>col1</td>
                            <td colspan="2">col2</td>
                            <td rowspan="2">col3</td>
                        </tr>
                        <tr>
                            <td>colum1</td>

                            <td>colum4</td>
                        </tr>
                    </tbody>
                </table>
