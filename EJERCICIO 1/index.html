<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios</title>
    <style>
        body {
            max-width: 820px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 48px 20px;
            color: #263449;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: #f3f6fb;
        }

        main {
            padding: 32px;
            border: 1px solid #e0e7f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 26px rgba(35, 62, 96, 0.09);
        }

        h1 {
            margin: 0 0 8px;
            color: #244b83;
            font-size: 2rem;
        }

        h1::after {
            display: block;
            width: 48px;
            height: 4px;
            margin-top: 8px;
            border-radius: 4px;
            background: #8eacd0;
            content: "";
        }

        main > p:first-of-type {
            margin: 0 0 22px;
            color: #64748b;
        }

        ul {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: ejercicios;
        }

        li {
            counter-increment: ejercicios;
        }

        a {
            color: #315f96;
            font-weight: 700;
            text-decoration: none;
        }

        li a {
            display: flex;
            min-height: 72px;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #e0e7f0;
            border-radius: 11px;
            background: #f8fafd;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        li a::before {
            display: grid;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            place-items: center;
            border-radius: 10px;
            background: #e4edf8;
            color: #244b83;
            content: counter(ejercicios, decimal-leading-zero);
            font-size: 0.82rem;
        }

        li a::after {
            margin-left: auto;
            color: #8eacd0;
            content: "→";
            font-size: 1.2rem;
        }

        li a:hover {
            transform: translateY(-2px);
            border-color: #9ab8dc;
            background: #f0f6fd;
            box-shadow: 0 6px 14px rgba(35, 62, 96, 0.08);
        }

        a:focus-visible {
            outline: 3px solid #9ab8dc;
            outline-offset: 3px;
        }

        main > p:last-child {
            margin: 24px 0 0;
        }

        main > p:last-child a {
            display: inline-block;
            padding: 9px 14px;
            border-radius: 8px;
            background: #eaf1f9;
        }

        main > p:last-child a:hover {
            background: #dce9f8;
        }

        @media (max-width: 520px) {
            body {
                padding: 22px 14px;
            }

            main {
                padding: 24px 18px;
            }

            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Ejercicios</h1>
        <p>Selecciona el ejercicio que quieres consultar:</p>
        <ul>
            <li><a href="Ejercicio1.html">Ejercicio 1: encabezados e imagen</a></li>
            <li><a href="Ejercicio1.2.html">Ejercicio 2: enlaces y capítulo</a></li>
            <li><a href="Ejercicio1tablas.html">Ejercicio de tablas</a></li>
            <li><a href="../EJERCICIO 2/Ejercicio2.html">Ejercicio 2: listas</a></li>
            <li><a href="../EJERCICIO 2/menus.html">Ejercicio 2: menús horizontal y vertical</a></li>
            <li><a href="../EJERCICIO 2/div-span.html">Ejercicio 2: etiquetas div y span</a></li>
        </ul>
        <p><a href="../index.html">Volver al inicio</a></p>
    </main>
</body>
</html>
